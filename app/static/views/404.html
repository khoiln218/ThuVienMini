<!-- Trang 404 độc lập (không nằm trong SPA): app/main.py trả file này với mã 404 khi trình duyệt mở đường dẫn không tồn tại. -->
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Không tìm thấy trang · Thư viện mini</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="stylesheet" href="/static/style.css?v=6" />
  </head>
  <body class="not-found">
    <div class="not-found-card" role="main">
      <img src="/static/logo.svg" alt="" width="64" height="64" />
      <span class="eyebrow">LỖI 404</span>
      <h1>Không tìm thấy trang</h1>
      <p class="muted">Đường dẫn <code id="path"></code> không có trong thư viện. Có thể liên kết đã cũ hoặc gõ sai.</p>
      <div class="not-found-actions">
        <a class="button primary" href="/">Về trang chính</a
        ><a class="button" href="javascript:history.back()">Quay lại</a>
      </div>
      <small>Quản lý thư viện mini · Nhóm 1</small>
    </div>
    <script>
      document.getElementById('path').textContent = location.pathname;
    </script>
  </body>
</html>
