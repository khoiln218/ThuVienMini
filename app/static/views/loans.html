<!-- Khung HTML của trang "loans". Được pages/index.js tải và gắn vào #pages khi khởi động; pages/loans.js điền dữ liệu bằng render(). -->
<div class="toolbar">
  <label class="filter"
    >Trạng thái
    <select id="loan-status">
      <option value="all">Tất cả phiếu</option>
      <option value="open">Đang mượn trong hạn</option>
      <option value="overdue">Quá hạn</option>
      <option value="returned">Đã trả</option>
    </select></label
  ><span class="toolbar-actions"
    ><a class="button" href="/api/export/loans.csv" download title="Tải toàn bộ danh sách về máy, mở bằng Excel"
      >Tải danh sách (Excel)</a
    ><button class="primary" id="add-loan">+ Lập phiếu mượn</button></span
  >
</div>
<div class="panel table-wrap">
  <table>
    <thead>
      <tr>
        <th>Phiếu</th>
        <th>Sách trong phiếu</th>
        <th>Độc giả</th>
        <th>Ngày mượn</th>
        <th>Hạn trả</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody id="loan-rows"></tbody>
  </table>
</div>
<div class="pager" id="loans-pager" hidden></div>
<p class="muted">
  Mỗi lần mượn lập một phiếu gồm một hoặc nhiều cuốn, hạn trả chung cho cả phiếu. Độc giả có thể trả từng cuốn. Ngày đến
  hạn vẫn được tính là trong hạn. Phiếu trong hạn được gia hạn một lần, tối đa 30 ngày.
</p>
